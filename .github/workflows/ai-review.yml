name: AI review

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review diff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Review diff with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Secret GEMINI_API_KEY is missing. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

          git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git diff --unified=3 "$BASE_SHA" "$HEAD_SHA" > /tmp/full.diff

          if [ ! -s /tmp/full.diff ]; then
            echo "Diff is empty. Skipping review."
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          diff = open("/tmp/full.diff", encoding="utf-8", errors="replace").read()
          limit = 80_000
          truncated = len(diff) > limit
          if truncated:
              diff = diff[:limit]

          system = (
              "You review a pull request. Return JSON only, with no markdown. "
              "severity must be high, medium, or low. "
              "high is a behavior bug that should block the merge. "
              "medium is a real risk. low is maintenance. "
              "Do not invent problems. Do not judge whether a GitHub Action version or model name exists. "
              "When the diff is fine, leave findings empty. "
              "Write every summary, title, and detail in English."
          )
          user = (
              "Review this git diff.\n"
              + ("The diff is truncated to 80 KB.\n" if truncated else "")
              + "JSON shape: "
              + '{"summary":"","findings":[{"severity":"high","file":"","line":1,"title":"","detail":""}]}\n\n'
              + diff
          )
          body = {
              "model": "gemini-3.8-flash",
              "temperature": 0.2,
              "max_tokens": 2048,
              "reasoning_effort": "low",
              "messages": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": user},
              ],
          }
          def parse_review(payload):
              text = payload["choices"][0]["message"]["content"].strip()
              if text.startswith("```"):
                  text = text.split("\n", 1)[1]
                  if text.rstrip().endswith("```"):
                      text = text.rstrip()[:-3]
              start = text.find("{")
              end = text.rfind("}")
              if start >= 0 and end > start:
                  text = text[start:end + 1]
              review = json.loads(text)
              if not isinstance(review, dict):
                  raise json.JSONDecodeError("Review is not an object", text, 0)
              return review

          review = None
          last_error = "Gemini request failed."
          for attempt in range(1, 4):
              request = urllib.request.Request(
                  "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions",
                  data=json.dumps(body).encode(),
                  headers={
                      "Authorization": "Bearer " + os.environ["GEMINI_API_KEY"],
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      payload = json.load(response)
                  review = parse_review(payload)
                  break
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", errors="replace")
                  last_error = f"Gemini request failed: {error.code} {detail}"
                  if error.code < 500 and error.code != 429:
                      raise SystemExit(last_error) from error
              except (TimeoutError, urllib.error.URLError) as error:
                  last_error = f"Gemini request timed out on attempt {attempt}: {error}"
              except (json.JSONDecodeError, KeyError, IndexError, TypeError) as error:
                  last_error = f"Gemini returned invalid JSON on attempt {attempt}: {error}"
              print(last_error, flush=True)
              if attempt < 3:
                  time.sleep(5 * attempt)
          if review is None:
              raise SystemExit(last_error)
          findings = review.get("findings") or []
          def is_false_version_claim(finding):
              text = f"{finding.get('title', '')} {finding.get('detail', '')}".lower()
              mentions_checkout = "checkout" in text
              claims_missing = any(phrase in text for phrase in ("neexistuj", "does not exist", "doesn't exist", "do not exist", "not exist"))
              return mentions_checkout and claims_missing

          findings = [finding for finding in findings if not is_false_version_claim(finding)]
          allowed = {"high", "medium", "low"}
          for finding in findings:
              severity = str(finding.get("severity", "")).lower()
              if severity not in allowed:
                  finding["severity"] = "low"
              else:
                  finding["severity"] = severity

          with open("review.json", "w", encoding="utf-8") as handle:
              json.dump({"summary": review.get("summary") or "", "findings": findings}, handle)

          lines = ["## AI review", "", review.get("summary") or "No summary.", ""]
          if not findings:
              lines.append("No findings.")
          else:
              labels = {"high": "High", "medium": "Medium", "low": "Low"}
              for finding in findings:
                  where = finding.get("file") or "?"
                  if finding.get("line"):
                      where += f":{finding['line']}"
                  lines.append(f"### {labels[finding['severity']]}: {finding.get('title') or 'Finding'}")
                  lines.append("")
                  lines.append(f"`{where}`")
                  lines.append("")
                  lines.append(finding.get("detail") or "")
                  lines.append("")
          if truncated:
              lines.append("The diff was truncated to 80 KB.")
          with open("comment.md", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines).strip() + "\n")
          PY

          jq -e . review.json >/dev/null
          high="$(jq '[.findings[] | select(.severity == "high")] | length' review.json)"
          echo "High findings: $high"
          jq . review.json

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md

          if [ "$high" -gt 0 ]; then
            echo "::error::Review found $high high-severity finding(s)."
            exit 1
          fi
