services:
  postgres:
    image: postgres:16
    container_name: educollab-postgres
    environment:
      POSTGRES_DB: EduCollab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EduCollab"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educollab-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: Server=postgres;Port=5432;Database=EduCollab;User Id=postgres;Password=postgres;
      Jwt__Issuer: EduCollab.Api
      Jwt__Audience: EduCollab.Client
      Jwt__SecretKey: replace-this-with-a-long-dev-secret-key
      Jwt__ExpirationMinutes: 60
      SessionJoin__SecretKey: replace-this-with-a-long-session-join-secret-key
      SessionJoin__Issuer: EduCollab.Api
      SessionJoin__Audience: EduCollab.CollabServer
      SessionJoin__ExpirationMinutes: "10"
      SessionJoin__ColyseusEndpoint: ws://localhost:2567
      SessionJoin__FrontendGuestJoinUrl: ${SessionJoin__FrontendGuestJoinUrl:-http://localhost:8080/sessions/join}
      SessionJoin__GuestLinkExpirationHours: "168"
      SessionJoin__AbandonedSessionIdleHours: "24"
      InternalApi__ApiKey: dev-internal-api-key-change-me
      Email__Enabled: ${Email__Enabled:-true}
      Email__SmtpHost: ${Email__SmtpHost:-}
      Email__SmtpPort: ${Email__SmtpPort:-587}
      Email__UseSsl: ${Email__UseSsl:-true}
      Email__UserName: ${Email__UserName:-}
      Email__Password: ${Email__Password:-}
      Email__FromAddress: ${Email__FromAddress:-noreply@skyform.space}
      Email__FromDisplayName: ${Email__FromDisplayName:-SkyForm}
      WorkspaceInvitation__FrontendAcceptUrl: ${WorkspaceInvitation__FrontendAcceptUrl:-https://skyform.space/workspace/join}
      EmailConfirmation__FrontendConfirmUrl: ${EmailConfirmation__FrontendConfirmUrl:-https://skyform.space/auth/confirm-email}
    ports:
      - "8080:8080"
    volumes:
      - app-data:/app/App_Data

  collab-server:
    build:
      context: ./Helpers/collab-server
      dockerfile: Dockerfile
    container_name: educollab-collab-server
    depends_on:
      - api
    environment:
      COLLAB_PORT: "2567"
      COLLAB_BIND_ADDR: "0.0.0.0"
      COLLAB_ALLOWED_ORIGINS: ${COLLAB_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      EDUCOLLAB_API_BASE: http://api:8080
      SESSION_JOIN_SECRET: replace-this-with-a-long-session-join-secret-key
      SESSION_JOIN_ISSUER: EduCollab.Api
      SESSION_JOIN_AUDIENCE: EduCollab.CollabServer
      EDUCOLLAB_INTERNAL_API_KEY: dev-internal-api-key-change-me
      COLLAB_LOG_LEVEL: info
      COLLAB_MONITOR_USER: admin
      COLLAB_MONITOR_PASSWORD: collab-dev
    ports:
      - "2567:2567"

volumes:
  postgres-data:
  app-data:
